<text x="2890" y="846" text-anchor="middle" fill="#334361" font-size="18" font-weight="600">[Внешняя программная система]</text>
<text x="2890" y="867" text-anchor="middle" fill="#334361" font-size="18" font-weight="600">Принимает квитанцию к отправке</text>
