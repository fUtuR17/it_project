<text x="1790" y="460.8333333333333" text-anchor="middle" fill="#182C40" font-size="22" font-weight="600">[Контейнер · веб-приложение]</text>
<text x="1790" y="485.8333333333333" text-anchor="middle" fill="#182C40" font-size="22" font-weight="600">Выполняет функции A1–A5</text>
<text x="1790" y="510.8333333333333" text-anchor="middle" fill="#182C40" font-size="22" font-weight="600">и взаимодействует с сервисами</text>
