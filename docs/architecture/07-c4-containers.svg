<text x="2890" y="446" text-anchor="middle" fill="#334361" font-size="18" font-weight="600">[Внешняя программная система]</text>
<text x="2890" y="467" text-anchor="middle" fill="#334361" font-size="18" font-weight="600">Проверяет документ</text>
