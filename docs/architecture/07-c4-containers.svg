<text x="2890" y="646" text-anchor="middle" fill="#334361" font-size="18" font-weight="600">[Внешняя программная система]</text>
<text x="2890" y="667" text-anchor="middle" fill="#334361" font-size="18" font-weight="600">Оплата, доплата и возврат</text>
