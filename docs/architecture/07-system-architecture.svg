<line data-interface="if04" x1="1395" y1="614" x2="1920" y2="614" stroke="#324D63" stroke-width="3" marker-end="url(#blue)" marker-start="url(#blue)"/><text x="1657.5" y="601" text-anchor="middle" fill="#324D63" font-size="20" font-weight="600">IF-04</text>
<line data-interface="if05" x1="1395" y1="734" x2="1920" y2="734" stroke="#324D63" stroke-width="3" marker-end="url(#blue)"/><text x="1657.5" y="721" text-anchor="middle" fill="#324D63" font-size="20" font-weight="600">IF-05</text>
<line data-interface="if06" x1="430" y1="854" x2="785" y2="854" stroke="#20746B" stroke-width="3" marker-end="url(#teal)"/><text x="607.5" y="841" text-anchor="middle" fill="#20746B" font-size="20" font-weight="600">IF-06</text>
<line data-interface="if07" x1="1090" y1="937" x2="1090" y2="996.5" stroke="#20746B" stroke-width="3" marker-end="url(#teal)" marker-start="url(#teal)"/><text x="1110" y="972.75" text-anchor="start" fill="#20746B" font-size="20" font-weight="600">IF-07</text>
