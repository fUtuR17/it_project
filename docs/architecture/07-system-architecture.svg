<svg xmlns="http://www.w3.org/2000/svg" width="2510" height="1140" viewBox="0 0 2510 1140" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
<title id="title">Компоненты и интерфейсы системы бронирования</title>
<desc id="desc">Личный кабинет, серверное приложение с предметными модулями, PostgreSQL, загрузка исходных данных и четыре внешних взаимодействия.</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#324D63"/></marker><marker id="teal" markerWidth="10" markerHeight="10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#20746B"/></marker></defs>
<rect width="2510" height="1140" fill="#FFFFFF"/>
<g id="owner"><rect x="80" y="306" width="350" height="76" rx="14" fill="#EDF0F3" stroke="#5B6978" stroke-width="2"/><text x="255" y="344" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#182C40">Владелец аккаунта</text></g>
<g id="cabinet"><rect x="80" y="500" width="350" height="94" rx="14" fill="#EAF3FA" stroke="#234E75" stroke-width="2"/><text x="255" y="547" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#182C40">Личный кабинет</text></g>
<g id="seed"><rect x="80" y="805" width="350" height="98" rx="14" fill="#E6F4F1" stroke="#20746B" stroke-width="2"/><text x="255" y="854" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#174F4B">Исходные данные о рейсах</text></g>
<g id="system"><rect x="570" y="157" width="1040" height="780" rx="14" fill="#F7FAFD" stroke="#234E75" stroke-width="3"/></g>
<g id="accounts"><rect x="785" y="214" width="610" height="80" rx="14" fill="#EAF3FA" stroke="#234E75" stroke-width="2"/><text x="1090" y="254" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#182C40">Аккаунты и доступ · A1</text></g>
<g id="docs"><rect x="785" y="334" width="610" height="80" rx="14" fill="#EAF3FA" stroke="#234E75" stroke-width="2"/><text x="1090" y="374" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#182C40">Пассажиры и документы · A2</text></g>
<g id="booking"><rect x="785" y="454" width="610" height="80" rx="14" fill="#EAF3FA" stroke="#234E75" stroke-width="2"/><text x="1090" y="494" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#182C40">Рейсы и бронирования · A3, A5</text></g>
<g id="payment"><rect x="785" y="574" width="610" height="80" rx="14" fill="#EAF3FA" stroke="#234E75" stroke-width="2"/><text x="1090" y="614" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#182C40">Платежи и билеты · A4</text></g>
<g id="view"><rect x="785" y="694" width="610" height="80" rx="14" fill="#EAF3FA" stroke="#234E75" stroke-width="2"/><text x="1090" y="734" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#182C40">Представление поездки · A5</text></g>
<g id="load"><rect x="785" y="814" width="610" height="80" rx="14" fill="#E6F4F1" stroke="#20746B" stroke-width="2"/><text x="1090" y="854" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#174F4B">Пакетная загрузка справочных данных</text></g>
<g id="reg"><rect x="1920" y="212" width="480" height="84" rx="14" fill="#F0F0F7" stroke="#596985" stroke-width="2"/><text x="2160" y="254" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#334361">Сервис регистрации</text></g>
<g id="verification"><rect x="1920" y="332" width="480" height="84" rx="14" fill="#F0F0F7" stroke="#596985" stroke-width="2"/><text x="2160" y="374" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#334361">Внешний сервис проверки документов</text></g>
<g id="psp"><rect x="1920" y="572" width="480" height="84" rx="14" fill="#F0F0F7" stroke="#596985" stroke-width="2"/><text x="2160" y="614" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#334361">Внешний платёжный сервис</text></g>
<g id="email"><rect x="1920" y="692" width="480" height="84" rx="14" fill="#F0F0F7" stroke="#596985" stroke-width="2"/><text x="2160" y="734" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#334361">Почтовая доставка</text></g>
<g id="db"><path d="M850,1014.5 A240,18 0 0 1 1330,1014.5 V1065.5 A240,18 0 0 1 850,1065.5 Z M850,1014.5 A240,18 0 0 0 1330,1014.5" fill="#E6F4F1" stroke="#20746B" stroke-width="3"/><text x="1090" y="1050" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600" fill="#174F4B">PostgreSQL</text></g>
<text x="50" y="56" fill="#182C40" font-size="32" font-weight="700">Компоненты и интерфейсы системы бронирования</text>
<text x="50" y="96" fill="#182C40" font-size="19" font-weight="400">Архитектура приложения · ответственность модулей, источники данных и внешние интеграции</text>
<text x="615" y="206" fill="#182C40" font-size="20" font-weight="700">Серверное приложение · единый компонент развёртывания</text>
<text x="1675" y="494" fill="#182C40" font-size="17" font-weight="400">Платёжная форма открывается на стороне сервиса.</text>
