<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="875" viewBox="0 0 1580 875" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title description"><title id="title">A-0 · Контекст системы бронирования авиабилетов</title><desc id="description">Функциональная модель IDEF0</desc><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#35648E"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#654C84"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#0D7668"/></marker><marker id="grey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#627080"/></marker></defs><rect width="1580" height="875" fill="#F2F6FA"/><rect x="18" y="16" width="1544" height="843" rx="14" fill="white" stroke="#D5E2ED" stroke-width="2"/><text x="42" y="48" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="29" font-weight="700">A-0 · Контекст системы бронирования авиабилетов</text><text x="42" y="82" text-anchor="start" dominant-baseline="middle" fill="#415972" font-size="17" font-weight="500">Функциональная модель IDEF0</text><polyline points="404,332 525,332" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="390" y="321.5" text-anchor="end" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">Данные и запросы</text><text x="390" y="342.5" text-anchor="end" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">владельца аккаунта</text><polyline points="404,425 525,425" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="390" y="414.5" text-anchor="end" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">Сведения о рейсах, местах,</text><text x="390" y="435.5" text-anchor="end" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">вместимости и ценах</text><polyline points="404,518 525,518" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="390" y="507.5" text-anchor="end" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">Результаты регистрации, проверки</text><text x="390" y="528.5" text-anchor="end" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">документов, платежей и возвратов</text><g id="context-O1"><polyline points="1055,286 1170,286" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1187" y="278" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">Доступ к личному кабинету</text><text x="1187" y="294" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">и результат регистрации</text></g>
<g id="context-O2"><polyline points="1055,324 1170,324" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1187" y="316" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">Сведения о пассажирах</text><text x="1187" y="332" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">и результат проверки документа</text></g>
<g id="context-O3"><polyline points="1055,362 1170,362" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1187" y="354" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">Сведения о рейсах и местах,</text><text x="1187" y="370" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">результат бронирования</text></g>
<g id="context-O4"><polyline points="1055,400 1170,400" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1187" y="392" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">Состояние оплаты</text><text x="1187" y="408" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">и оформленный билет</text></g>
<g id="context-O5"><polyline points="1055,438 1170,438" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1187" y="430" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">Сведения и результаты</text><text x="1187" y="446" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">обслуживания бронирования</text></g>
<g id="context-O6"><polyline points="1055,476 1170,476" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1187" y="468" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">Запрос на регистрацию</text><text x="1187" y="484" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">учётной записи</text></g>
<g id="context-O7"><polyline points="1055,514 1170,514" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1187" y="506" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">Запрос на проверку</text><text x="1187" y="522" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">документа пассажира</text></g>
<g id="context-O8"><polyline points="1055,552 1170,552" fill="none" stroke="#35648E" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/><text x="1187" y="544" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">Запросы на оплату, доплату</text><text x="1187" y="560" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="16" font-weight="500">и обработку возврата</text></g>
<polyline points="650,175 650,268" fill="none" stroke="#654C84" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#purple)"/><text x="650" y="130.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">Правила доступа к аккаунту</text><text x="650" y="151.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">и допуска пассажира</text><polyline points="945,175 945,268" fill="none" stroke="#654C84" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#purple)"/><text x="945" y="130.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">Правила вместимости, оплаты</text><text x="945" y="151.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="500">и обслуживания бронирования</text><polyline points="550,662 550,570" fill="none" stroke="#627080" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#grey)"/><text x="590" y="698.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="15" font-weight="500">Приложение</text><text x="590" y="717.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="15" font-weight="500">и база данных</text><polyline points="705,662 705,570" fill="none" stroke="#627080" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#grey)"/><text x="723" y="698.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="15" font-weight="500">Сервис</text><text x="723" y="717.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="15" font-weight="500">регистрации</text><polyline points="860,662 860,570" fill="none" stroke="#627080" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#grey)"/><text x="856" y="698.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="15" font-weight="500">Внешний сервис</text><text x="856" y="717.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="15" font-weight="500">проверки документов</text><polyline points="1015,662 1015,570" fill="none" stroke="#627080" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#grey)"/><text x="989" y="698.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="15" font-weight="500">Внешний платёжный</text><text x="989" y="717.5" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="15" font-weight="500">сервис</text><rect x="525" y="268" width="530" height="302" fill="#EFF5FC" stroke="#294E70" stroke-width="2.3"/><text x="790" y="399" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="27" font-weight="700">Обеспечить бронирование</text><text x="790" y="431" text-anchor="middle" dominant-baseline="middle" fill="#13273B" font-size="27" font-weight="700">и обслуживание авиабилетов</text><text x="1040" y="556" text-anchor="end" dominant-baseline="middle" fill="#294E70" font-size="16" font-weight="700">0</text><text x="53" y="795" text-anchor="start" dominant-baseline="middle" fill="#13273B" font-size="17" font-weight="700">Цель — установить состав функций, необходимые данные и наблюдаемые результаты.</text><text x="53" y="831" text-anchor="start" dominant-baseline="middle" fill="#415972" font-size="17" font-weight="500">Точка зрения — приложение и его взаимодействие с внешними сервисами.</text></svg>
