<text paint-order="stroke" stroke="#FBFCFD" stroke-width="4" x="2082.5" y="511.25" text-anchor="middle" fill="#243F54" font-size="20" font-weight="600">→ Запросы оплаты, доплаты и возврата</text>
<text paint-order="stroke" stroke="#FBFCFD" stroke-width="4" x="2082.5" y="533.25" text-anchor="middle" fill="#243F54" font-size="20" font-weight="600">← Ссылки и результаты</text>
