<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1330" viewBox="0 0 1400 1330" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif"><title id="title">Модели жизненного цикла системы бронирования авиабилетов</title><desc id="desc">Пять диаграмм состояний UML. Условия, события и действия переходов приведены в сопроводительном документе.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#61778C"/></marker></defs><rect width="1400" height="1330" fill="#F3F6FA"/>
<text x="20" y="37" text-anchor="start" dominant-baseline="middle" fill="#152638" font-size="29" font-weight="700">Система бронирования авиабилетов</text>
<text x="20" y="72" text-anchor="start" dominant-baseline="middle" fill="#3F5268" font-size="17" font-weight="500">Модели жизненного цикла · диаграммы состояний UML · согласованная редакция</text>
<g transform="translate(20 99)"><rect width="1360" height="379" rx="15" fill="white" stroke="#D6E2ED" stroke-width="2"/><text x="24" y="32" text-anchor="start" dominant-baseline="middle" fill="#152638" font-size="23" font-weight="700">01  Бронирование</text><text x="24" y="62" text-anchor="start" dominant-baseline="middle" fill="#3F5268" font-size="15" font-weight="500">Успешная оплата, завершение без оплаты, отмена и действия после покупки.</text><polyline points="93,191 225,191" fill="none" stroke="#61778C" stroke-width="2" marker-end="url(#arrow)"/><text x="151" y="176" text-anchor="middle" dominant-baseline="middle" fill="#0B6458" font-size="15" font-weight="700" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">B01</text><polyline points="455,191 632,191" fill="none" stroke="#61778C" stroke-width="2" marker-end="url(#arrow)"/><text x="538" y="176" text-anchor="middle" dominant-baseline="middle" fill="#0B6458" font-size="15" font-weight="700" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">B02</text><polyline points="832,191 1010,191" fill="none" stroke="#61778C" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="176" text-anchor="middle" dominant-baseline="middle" fill="#0B6458" font-size="15" font-weight="700" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">B04</text><polyline points="340,222 340,299" fill="none" stroke="#61778C" stroke-width="2" marker-end="url(#arrow)"/><text x="368" y="262" text-anchor="middle" dominant-baseline="middle" fill="#0B6458" font-size="15" font-weight="700" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">B03</text><circle cx="86" cy="191" r="7" fill="#152638"/><rect x="225" y="160" width="230" height="62" rx="12" fill="#EEF4FB" stroke="#8095AB" stroke-width="2"/><text x="340" y="191" text-anchor="middle" dominant-baseline="middle" fill="#152638" font-size="17" font-weight="650">Ожидает оплаты</text><rect x="632" y="160" width="200" height="62" rx="12" fill="#EEF4FB" stroke="#8095AB" stroke-width="2"/><text x="732" y="191" text-anchor="middle" dominant-baseline="middle" fill="#152638" font-size="17" font-weight="650">Оплачено</text><rect x="1010" y="160" width="240" height="62" rx="12" fill="#E8F5F1" stroke="#0B6458" stroke-width="2"/><text x="1130" y="191" text-anchor="middle" dominant-baseline="middle" fill="#152638" font-size="17" font-weight="650">Отменено</text><rect x="218" y="299" width="244" height="62" rx="12" fill="#E8F5F1" stroke="#0B6458" stroke-width="2"/><text x="340" y="330" text-anchor="middle" dominant-baseline="middle" fill="#152638" font-size="17" font-weight="650">Прекращено без оплаты</text><text x="660" y="283" text-anchor="start" dominant-baseline="middle" fill="#152638" font-size="17" font-weight="700">Внутренние действия в состоянии «Оплачено»</text><text x="660" y="314" text-anchor="start" dominant-baseline="middle" fill="#3F5268" font-size="16" font-weight="500">B05 — смена места в пределах рейса</text><text x="660" y="343" text-anchor="start" dominant-baseline="middle" fill="#3F5268" font-size="16" font-weight="500">B06 — добавление багажа и начало доплаты</text></g>
<g transform="translate(20 496)"><rect width="670" height="319" rx="15" fill="white" stroke="#D6E2ED" stroke-width="2"/><text x="24" y="32" text-anchor="start" dominant-baseline="middle" fill="#152638" font-size="23" font-weight="700">02  Платёжная попытка</text><text x="24" y="62" text-anchor="start" dominant-baseline="middle" fill="#3F5268" font-size="15" font-weight="500">Основная оплата и доплата за багаж.</text><polyline points="60,191 124,191" fill="none" stroke="#61778C" stroke-width="2" marker-end="url(#arrow)"/><text x="92" y="176" text-anchor="middle" dominant-baseline="middle" fill="#0B6458" font-size="15" font-weight="700" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">M01</text><polyline points="316,178 356,178 356,139 404,139" fill="none" stroke="#61778C" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="124" text-anchor="middle" dominant-baseline="middle" fill="#0B6458" font-size="15" font-weight="700" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">M02</text><polyline points="316,204 356,204 356,255 404,255" fill="none" stroke="#61778C" stroke-width="2" marker-end="url(#arrow)"/><text x="356" y="269" text-anchor="middle" dominant-baseline="middle" fill="#0B6458" font-size="15" font-weight="700" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">M03</text><circle cx="53" cy="191" r="7" fill="#152638"/><rect x="124" y="160" width="192" height="62" rx="12" fill="#EEF4FB" stroke="#8095AB" stroke-width="2"/><text x="220" y="191" text-anchor="middle" dominant-baseline="middle" fill="#152638" font-size="17" font-weight="650">Результат ожидается</text><rect x="404" y="108" width="218" height="62" rx="12" fill="#E8F5F1" stroke="#0B6458" stroke-width="2"/><text x="513" y="139" text-anchor="middle" dominant-baseline="middle" fill="#152638" font-size="17" font-weight="650">Оплата подтверждена</text><rect x="404" y="224" width="218" height="62" rx="12" fill="#E8F5F1" stroke="#0B6458" stroke-width="2"/><text x="513" y="245" text-anchor="middle" dominant-baseline="middle" fill="#152638" font-size="17" font-weight="650">Попытка завершена</text><text x="513" y="265" text-anchor="middle" dominant-baseline="middle" fill="#152638" font-size="17" font-weight="650">без оплаты</text></g>
